<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NVS Dashboard</title>
<!-- build-20260814-set -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
  /* PixelMplus 10/12 - outline conversions of classic 10/12-dot bitmap gothic (M+ license).
     Strict half/full-width grid: ASCII=0.5em, kanji=1em -> HP200LX-style fixed pitch. */
  @font-face{font-family:'PixelMplus10';
    src:url('https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus10-Regular.ttf') format('truetype');
    font-weight:normal;font-display:swap;}
  @font-face{font-family:'PixelMplus10';
    src:url('https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus10-Bold.ttf') format('truetype');
    font-weight:bold;font-display:swap;}
  @font-face{font-family:'PixelMplus12';
    src:url('https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus12-Regular.ttf') format('truetype');
    font-weight:normal;font-display:swap;}
  @font-face{font-family:'PixelMplus12';
    src:url('https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus12-Bold.ttf') format('truetype');
    font-weight:bold;font-display:swap;}
  /* ---- HP 200LX / Lotus 1-2-3 ---- one font, one ink, one LCD ---- */
  :root{
    --fs:12px;                                                   /* sheet dot size   */
    --sheet:'PixelMplus12','PixelMplus10','DotGothic16',monospace; /* sheet font grid */
    --lcd:#a9b09b;   /* LCD screen      */
    --lcd2:#99a18b;  /* LCD shadow      */
    --ink:#26291f;   /* pixel ink       */
    --ink2:#555e49;  /* dim ink         */
    --memow:300px;   /* memo pane width */
    --tick:24px;     /* news banner height */
  }
  *{box-sizing:border-box}
  ::selection{background:var(--ink);color:var(--lcd)}
  html,body{height:100%}
  /* ONE grid for the whole screen: every element inherits the same dot font+size,
     like the 200LX's 640x200 LCD — the Font menu re-zooms the entire UI at once. */
  body{margin:0;background:var(--lcd);color:var(--ink);
       font-family:var(--sheet);font-size:var(--fs);line-height:1.3;
       letter-spacing:0;-webkit-font-smoothing:none;font-synthesis:none}
  /* system (outline) fonts read better antialiased; bitmap fonts stay aliased */
  body.smooth{-webkit-font-smoothing:antialiased}
  /* top bar = Lotus inverse status line */
  header{display:flex;align-items:center;gap:14px;padding:6px 14px;
         padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));
         background:var(--ink);color:var(--lcd);flex-wrap:wrap}
  header h1{font-size:inherit;margin:0;font-weight:bold}
  #tickerBox{display:flex;gap:8px;align-items:center}
  /* no text-transform: the box takes Japanese too — uppercasing happens on send */
  #ticker{width:110px;padding:2px 8px;border:0;border-radius:0;
          background:var(--lcd);color:var(--ink);font:inherit;outline:none}
  #ticker::placeholder{color:var(--ink2)}
  button{padding:2px 10px;border:0;border-radius:0;background:var(--lcd);color:var(--ink);
         font:inherit;cursor:pointer}
  button:hover{background:var(--lcd2)}
  button:disabled{background:var(--ink2);color:var(--lcd);cursor:default}
  #status{color:var(--lcd);display:flex;align-items:center;gap:9px;font:inherit;min-height:16px}
  #status.gone{opacity:0;transition:opacity .5s steps(4,end)}
  /* 8-bit sprite: a 2px block whose box-shadow paints the other pixels */
  .dot{width:2px;height:2px;flex:none;background:transparent;border-radius:0;
       margin-right:16px;transform:translateY(-5px)}
  .dot.busy{animation:pulse .7s steps(2,end) infinite}
  .dot.error{animation:pulse .45s steps(2,end) infinite}
  @keyframes pulse{50%{opacity:.2}}
  #userbox{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:inherit;color:var(--lcd2)}
  /* tabs = plain text, active is inverse video */
  nav{display:flex;gap:2px;padding:4px 14px 0;flex-wrap:wrap}
  nav .tab{padding:1px 8px;border:0;border-radius:0;background:transparent;
           color:var(--ink2);cursor:pointer;font-size:inherit;user-select:none}
  nav .tab.active{background:var(--ink);color:var(--lcd);font-weight:400}
  nav .tab small{color:inherit;opacity:.75;font-weight:400;margin-left:6px}
  nav .tab .x{margin-left:7px;padding:0 3px;color:inherit;opacity:.6;font-weight:400}
  nav .tab .x:hover{opacity:1;background:var(--ink);color:var(--lcd)}
  nav .restore{padding:1px 8px;border:0;color:var(--ink2);cursor:pointer;font-size:inherit;
               user-select:none;background:transparent;text-decoration:underline dotted}
  nav .restore:hover{color:var(--ink)}
  /* settings live behind one button so the status line stays clean */
  #setBox{position:relative}
  #setBtn{background:transparent;border:1px solid var(--lcd2);color:var(--lcd);padding:0 8px}
  #setBtn:hover,#setBtn.on{background:var(--lcd);color:var(--ink)}
  #setPanel{position:absolute;top:calc(100% + 5px);left:0;z-index:200;
            background:var(--lcd);color:var(--ink);border:1px solid var(--ink);
            padding:6px 8px;display:grid;grid-template-columns:auto auto;gap:4px 10px;
            align-items:center;white-space:nowrap}
  #setPanel[hidden]{display:none}
  #setPanel label{color:var(--ink2)}
  #setPanel select{background:var(--lcd);color:var(--ink);border:1px solid var(--ink2);
                   font:inherit;padding:1px 3px;border-radius:0;outline:none;cursor:pointer}
  #setPanel select:hover{border-color:var(--ink)}
  #setPanel input[type=checkbox]{accent-color:var(--ink);margin:0;cursor:pointer}
  #setPanel input[type=color]{width:26px;height:15px;padding:0;border:1px solid var(--ink2);
                              background:var(--lcd);border-radius:0;cursor:pointer;vertical-align:-2px}
  #setPanel a{color:var(--ink)}
  #setPanel .rst{cursor:pointer;color:var(--ink2);text-decoration:underline dotted;margin-left:6px}
  #setPanel .rst:hover{color:var(--ink)}
  main{padding:2px 14px 14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));
       display:flex;align-items:stretch}
  .card{flex:1 1 auto;min-width:0;background:var(--lcd);border:1px solid var(--ink);border-radius:0;
        overflow:auto;-webkit-overflow-scrolling:touch;outline:none;
        max-height:calc(100vh - 128px - var(--tick));max-height:calc(100dvh - 128px - var(--tick))}
  .card::-webkit-scrollbar{width:12px;height:12px}
  .card::-webkit-scrollbar-track{background:var(--lcd2)}
  .card::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--lcd2)}
  .meta{display:flex;gap:14px;align-items:baseline;padding:4px 10px 2px;color:var(--ink2)}
  .meta b{color:var(--ink);font-weight:bold}
  table{border-collapse:collapse;width:100%;font-family:var(--sheet);letter-spacing:0}
  table.fixed{table-layout:fixed;width:auto;min-width:100%}
  th,td{padding:1px 8px;border:0;white-space:nowrap;font-size:var(--fs);line-height:1.3;
        overflow:hidden;text-overflow:ellipsis}
  /* column header row = inverse video like Lotus */
  th{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--lcd);
     text-align:right;font-weight:400}
  td:first-child,th:first-child{position:sticky;left:0}
  th:first-child{text-align:left;z-index:3}
  td{text-align:right}
  td.txt{text-align:left}
  td:first-child{text-align:left;color:var(--ink);z-index:1;background:var(--lcd)}
  th.fc{background:var(--ink2);color:var(--lcd)}
  td.num{color:var(--ink)}
  /* drag the right edge of any header to set that column's width */
  th .rz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;
         user-select:none;touch-action:none}
  th .rz:hover{background:var(--lcd2)}
  tr:hover td{background:var(--lcd2)}
  #empty{padding:60px;text-align:center;color:var(--ink2)}
  /* ---- boot splash: pixel MVP over the LCD, gone in a second and a half ---- */
  #splash{position:fixed;inset:0;z-index:9999;background:var(--lcd);
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
          transition:opacity .4s steps(5,end)}
  #splash.gone{opacity:0;pointer-events:none}
  #splash::after{content:'';position:absolute;inset:0;pointer-events:none;
          background:repeating-linear-gradient(to bottom,rgba(0,0,0,.11) 0 1px,transparent 1px 3px)}
  #splashLogo{image-rendering:pixelated;image-rendering:crisp-edges;
          width:min(62vw,432px);height:auto}
  #splashInfo{font-family:var(--sheet);color:var(--ink);font-size:calc(var(--fs) * 1.25);
          letter-spacing:2px;text-align:center;line-height:1.6}
  #splashInfo .sub{color:var(--ink2);letter-spacing:4px;font-size:calc(var(--fs) * .9)}
  #splashCur{display:inline-block;width:.6em;height:1em;vertical-align:-2px;
          background:var(--ink);animation:blink 1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:0}}
  #clock{color:var(--lcd);white-space:nowrap}
  #clock b{font-weight:bold}
  /* ---- bottom news / quote banner: one long strip, scrolling forever ---- */
  #tick{position:fixed;left:0;right:0;bottom:0;height:var(--tick);z-index:60;
        overflow:hidden;display:flex;align-items:center;
        background:var(--ink);color:var(--lcd);border-top:1px solid var(--lcd2)}
  #tick.off{display:none}
  #tickTrack{display:inline-flex;flex:none;white-space:nowrap;will-change:transform;
             animation:tickroll 120s linear infinite}
  #tick:hover #tickTrack{animation-play-state:paused}
  @keyframes tickroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  #tick .run{display:inline-flex;align-items:center;white-space:nowrap}
  #tick a{color:var(--lcd);text-decoration:none}
  #tick a:hover{background:var(--lcd);color:var(--ink)}
  #tick .sep{opacity:.4;padding:0 12px}
  #tick .q b{font-weight:bold}
  #tick .q .up::before{content:'▲ '}
  #tick .q .dn::before{content:'▼ '}
  #tick .src{opacity:.55;padding-right:5px}
  /* ---- MEMO: MemoExpress-style shared notepad, split pane on the right ---- */
  #split{width:14px;flex:none;cursor:col-resize;background:var(--lcd2);touch-action:none;
         border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
         display:flex;align-items:center;justify-content:center;user-select:none}
  #split::before{content:'';width:4px;height:34px;
         border-left:2px dotted var(--ink);border-right:2px dotted var(--ink)}
  #split:hover,#split.on{background:var(--ink2)}
  #split:hover::before,#split.on::before{border-color:var(--lcd)}
  body.dragging{cursor:col-resize;user-select:none;-webkit-user-select:none}
  #memoWrap{flex:none;width:var(--memow);min-width:140px;display:flex;flex-direction:column;
            border:1px solid var(--ink);max-height:calc(100vh - 128px - var(--tick));max-height:calc(100dvh - 128px - var(--tick))}
  /* the memo pane's own chrome lives in memo.js (injected <style>) */
  .reload{margin-left:8px;background:transparent;border:1px solid var(--ink2);color:var(--ink2);
          padding:0 8px;font-size:inherit}
  .reload:hover{color:var(--lcd);background:var(--ink);border-color:var(--ink)}
  #gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .gatebox{background:var(--lcd);border:1px solid var(--ink);border-radius:0;
           padding:36px 40px;max-width:420px;text-align:center}
  .gatebox h1{font-size:20px;margin:0 0 8px;font-weight:400}
  .gatebox p{color:var(--ink2);margin:0 0 20px}
  #signin{background:var(--ink);color:var(--lcd);border-radius:0;padding:8px 18px;font-size:16px}
  #signin:hover{background:var(--ink2)}
  #gateMsg{margin-top:14px;font-size:14px;color:var(--ink2);min-height:20px}
  /* ---- phones ---- */
  @media (max-width:640px){
    header{padding:6px 10px;gap:8px 10px}
    header h1{order:1}
    #userbox{order:2;gap:8px}
    #tickerBox{order:3;flex:1 1 100%}
    #ticker{flex:1 1 auto;width:auto;padding:6px 8px}
    #status{order:4;flex:1 1 100%}
    nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 10px 0}
    nav .tab{flex:0 0 auto;padding:4px 8px}
    main{padding:2px 8px 12px;flex-direction:column}
    #split{display:none}
    #memoWrap{width:auto;margin-top:8px;min-height:210px;max-height:none}
    .card{max-height:calc(100dvh - 165px - var(--tick))}
    #tick{font-size:calc(var(--fs) * .95)}
    th,td{padding:4px 10px}
    .meta{flex-wrap:wrap;gap:4px 12px;padding:6px 10px 2px}
    .gatebox{padding:28px 22px}
  }
</style>
<script>
// Paint the saved screen colour before the first frame — otherwise the default
// LCD green flashes for a moment on every load. Mirrors applyBg() further down;
// it has to live here, inline, to run ahead of the body.
(function () {
  try {
    var s = document.documentElement.style;
    var rgb = function (h) { var n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; };
    var hx  = function (a) { return '#' + ((1<<24)+(a[0]<<16)+(a[1]<<8)+a[2]).toString(16).slice(1); };
    var dk  = function (h,k) { return hx(rgb(h).map(function (v) { return Math.round(v*k); })); };
    var lt  = function (h,k) { return hx(rgb(h).map(function (v) { return Math.round(v+(255-v)*k); })); };
    var bg = localStorage.getItem('nvsBg');
    if (bg && /^#[0-9a-f]{6}$/i.test(bg)) {
      var c = rgb(bg), L = (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255;
      s.setProperty('--lcd', bg);
      if (L > 0.42) { s.setProperty('--lcd2', dk(bg,0.90)); s.setProperty('--ink', dk(bg,0.22)); s.setProperty('--ink2', dk(bg,0.52)); }
      else          { s.setProperty('--lcd2', lt(bg,0.12)); s.setProperty('--ink', lt(bg,0.86)); s.setProperty('--ink2', lt(bg,0.52)); }
    }
    var sz = parseInt(localStorage.getItem('nvsSize'), 10);
    if (sz) s.setProperty('--fs', sz + 'px');
    var w = parseInt(localStorage.getItem('nvsMemoW'), 10);
    if (w) s.setProperty('--memow', w + 'px');
  } catch (e) {}
})();
</script>

<script>
// ==================== PASTE YOUR FIREBASE CONFIG ====================
// Firebase console > Project settings > General > Your apps > Web app
const firebaseConfig = {
  apiKey: "AIzaSyBqdB2Oqg37poRoo05QpDmUITguvFKkDAw",
  authDomain: "research-92f30.firebaseapp.com",
  databaseURL: "https://research-92f30-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "research-92f30",
  storageBucket: "research-92f30.appspot.com",
  messagingSenderId: "522522297422",
  appId: "1:522522297422:web:dbbffb4621d08e3de32f1f",
};
// ====================================================================

const ALLOWED_DOMAIN = 'missionvalue.com';

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
let data = {};        // code -> payload
let active = null;
// tabs the user has "closed" (hidden from the strip; data stays in Firebase)
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem('nvsHidden') || '[]')); } catch (e) {}
function saveHidden(){ try { localStorage.setItem('nvsHidden', JSON.stringify([...hidden])); } catch (e) {} pushUi(); }
function unhide(code){ if (code && hidden.has(code)) { hidden.delete(code); saveHidden(); } }
let pendingFocus = null;  // a code whose "done" arrived before its data
let wired = false;    // data listeners attached only once, after sign-in
// declared up here (var, not let) because saveHidden()/applyFont() call pushUi()
// while the script is still executing — a `let` further down would be in its TDZ.
var uiApplying = false;   // true while applying a remote snapshot (suppresses echo writes)

const $ = id => document.getElementById(id);

// ---- 8-bit status sprites, painted with box-shadow so they follow the palette ----
const SPRITE = {
  ok:   ['........','.......X','......XX','X....XX.','XX..XX..','.XXXX...','..XX....','........'],
  busy: ['XXXXXXXX','.XXXXXX.','..XXXX..','...XX...','..XXXX..','.XXXXXX.','XXXXXXXX','........'],
  ask:  ['..XXXX..','.XX..XX.','.....XX.','....XX..','...XX...','........','...XX...','........'],
  err:  ['........','.XX..XX.','..XXXX..','...XX...','..XXXX..','.XX..XX.','........','........']
};
function paintSprite(el, name, px){
  const bmp = SPRITE[name];
  if (!bmp) { el.style.boxShadow = 'none'; el.style.marginRight = '0'; return; }
  px = px || 2;
  const out = [];
  bmp.forEach((row, y) => row.split('').forEach((c, x) => {
    if (c === 'X') out.push((x * px) + 'px ' + (y * px) + 'px 0 0 currentColor');
  }));
  el.style.width = px + 'px';
  el.style.height = px + 'px';
  el.style.boxShadow = out.join(',');
  el.style.marginRight = (8 * px) + 'px';
}
let statusTimer = null;
// `hold` keeps a message up (loading); everything else clears itself like a banner
function setStatus(cls, text, hold){
  const dot = $('dot'), box = $('status');
  dot.className = 'dot ' + (cls || '');
  paintSprite(dot, cls === 'busy' ? 'busy' : cls === 'ok' ? 'ok'
                  : cls === 'ask' ? 'ask' : cls === 'err' ? 'err' : null);
  $('statusText').textContent = text || '';
  box.classList.remove('gone');
  clearTimeout(statusTimer);
  if (!hold && text) {
    statusTimer = setTimeout(() => {
      box.classList.add('gone');
      setTimeout(() => { if (box.classList.contains('gone')) setStatus('', ''); }, 600);
    }, 7000);
  }
}

const provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({ hd: ALLOWED_DOMAIN });  // no forced re-auth: reuse the trusted browser session

function show(view){ // 'gate' or 'app'
  $('gate').style.display = view === 'gate' ? 'flex' : 'none';
  $('app').style.display  = view === 'app'  ? 'block' : 'none';
}

$('signin').onclick = () => {
  $('gateMsg').textContent = 'Opening Google sign-in…';
  auth.signInWithPopup(provider).catch(e => {
    $('gateMsg').innerHTML = '<span class="err">' + (e.message || e) + '</span>';
  });
};
$('signout') && ($('signout').onclick = () => auth.signOut());

auth.onAuthStateChanged(user => {
  if (!user) { show('gate'); $('gateMsg').textContent = ''; return; }
  var email = (user.email || '').toLowerCase();
  var domainOk = email.endsWith('@' + ALLOWED_DOMAIN) && user.emailVerified;
  if (!domainOk) {
    show('gate');
    $('gateMsg').innerHTML = '<span class="err">' + email +
      ' is not a @' + ALLOWED_DOMAIN + ' account. Access denied.</span>';
    auth.signOut();
    return;
  }
  // authorised
  show('app');
  $('who').textContent = email.split('@')[0];
  setStatus('', '');
  if (wired) return;
  wired = true;

  loadDbFont('JFDotElisa8', 'elisa8');          // \u6075\u68a8\u6c99 8-dot (HP200LX)

  loadDbFont('JFDotShinonome12', 'shinonome12'); // \u6771\u96f2 12-dot

  initMemo(email);
  initUiSync();

  db.ref('nvs/data').on('value', snap => {
    data = snap.val() || {};
    if (pendingFocus && data[pendingFocus]) {   // the just-loaded ticker finally has data
      active = pendingFocus;
      pendingFocus = null;
    } else if (active === null || !data[active]) {
      const codes = sortedCodes();
      active = codes.length ? codes[0] : null;
    }
    render();
  });

  // nvs/status keeps the *last* event forever, so the first snapshot after a
  // reload is a replay, not news. Acting on it would re-open the tab you just
  // closed (and steal focus) on every single load — so only react to changes.
  let statusSeen = null;
  db.ref('nvs/status').on('value', snap => {
    const s = snap.val();
    if (!s) return;
    const stamp = [s.at || 0, s.code || '', s.state || ''].join('|');
    const isNew = statusSeen !== null && stamp !== statusSeen;
    statusSeen = stamp;
    if (s.state === 'loading') setStatus('busy', s.code + ' — Excel is loading…', true);
    else if (s.state === 'done') {
      // jump the view to the ticker that just finished loading
      if (isNew) {
        unhide(s.code);                     // fresh data re-opens a closed tab
        if (s.code && data[s.code]) { active = s.code; render(); }
        else pendingFocus = s.code;         // data may arrive a beat later
      }
      const when = new Date(s.at || Date.now()).toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
      setStatus('ok', (s.msg || s.code) + ' — updated ' + when);
    }
    else if (s.state === 'notfound') setStatus('ask', s.code + ' — not a valid company code (unknown, delisted, or not a company)');
    else if (s.state === 'timeout') setStatus('err', s.code + ' — 接続がタイムアウトされました (connection timed out) — try reloading');
    else if (s.state === 'error') setStatus('err', s.code + ': ' + (s.msg || 'failed'));
  });
});

function sortedCodes(){
  return Object.keys(data)
    .filter(c => !hidden.has(c))
    .sort((a,b) => (data[b].updatedAt||0) - (data[a].updatedAt||0));
}

function closeTab(code){
  hidden.add(code);
  if (active === code) {                 // settle the new active tab *before* saving,
    const codes = sortedCodes();         // so the pushed state is already correct
    active = codes.length ? codes[0] : null;
  }
  render();                              // repaint immediately — never wait on the network
  saveHidden();                          // persist locally + push to Firebase
}

function request(code){
  // uppercase only here, on the way out: 429a -> 429A so lookups don't fail,
  // while anything Japanese passes through untouched
  code = String(code||'').trim().toUpperCase();
  if (!code) return;
  unhide(code);                                   // re-requesting a closed tab brings it back
  db.ref('nvs/request').set({ code: code, id: Date.now() });
  setStatus('busy', code + ' — sent to the PC…', true);
}

// The box is left exactly as typed — auto-capitalising it mangled Japanese
// input. request() is the only place that uppercases, on the way to Excel.
$('go').onclick = () => request($('ticker').value);
$('ticker').addEventListener('keydown', e => { if (e.key === 'Enter') request($('ticker').value); });

// bitmap fonts served out of the Firebase backend itself (nvs/fonts/*, uploaded once via Apps Script)
function loadDbFont(family, key){
  db.ref('nvs/fonts/' + key + '/b64').once('value').then(snap => {
    const b64 = snap.val();
    if (!b64) return;
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const f = new FontFace(family, buf.buffer);
    return f.load().then(() => document.fonts.add(f));
  }).catch(e => console.warn('font ' + key + ':', e && e.message));
}
// ---- boot splash: MVP drawn as real pixels, then the date and the clock ----
const WDJ = ['日','月','火','水','木','金','土'];
const GLYPH = {                       // 7 x 9, two-pixel strokes — proper arcade weight
  M: ['XX...XX','XXX.XXX','XXXXXXX','XX.X.XX','XX...XX','XX...XX','XX...XX','XX...XX','XX...XX'],
  V: ['XX...XX','XX...XX','XX...XX','XX...XX','XX...XX','.XX.XX.','.XX.XX.','..XXX..','..XXX..'],
  P: ['XXXXXX.','XXXXXXX','XX...XX','XX...XX','XXXXXXX','XXXXXX.','XX.....','XX.....','XX.....']
};
function drawLogo(){
  const cv = $('splashLogo');
  if (!cv || !cv.getContext) return;
  const g = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim() || '#26291f';
  const ink2 = css.getPropertyValue('--ink2').trim() || '#555e49';
  const S = 10;                                  // one logical pixel = 10 device px
  g.clearRect(0, 0, cv.width, cv.height);
  // draw twice: a dim block one pixel down-right, then the solid face on top
  [[1, 1, ink2], [0, 0, ink]].forEach(([dx, dy, colour]) => {
    g.fillStyle = colour;
    let col = 0;
    'MVP'.split('').forEach(ch => {
      GLYPH[ch].forEach((row, y) => {
        row.split('').forEach((c, x) => {
          if (c === 'X') g.fillRect((col + x + dx) * S, (y + dy) * S, S, S);
        });
      });
      col += 9;                                  // 7 wide + 2 blank columns
    });
  });
}
function splashText(){
  const d = new Date();
  const p2 = n => (n < 10 ? '0' : '') + n;
  const date = d.getFullYear() + '/' + p2(d.getMonth() + 1) + '/' + p2(d.getDate()) +
               ' (' + WDJ[d.getDay()] + ')';
  const time = p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  const el = $('splashInfo');
  if (el) el.innerHTML = date + '　' + time + ' <span id="splashCur"></span>' +
                         '<div class="sub">MISSION VALUE</div>';
}
(function(){
  const sp = $('splash');
  if (!sp) return;
  drawLogo();
  splashText();
  const t = setInterval(splashText, 1000);
  setTimeout(() => {
    clearInterval(t);
    sp.classList.add('gone');
    setTimeout(() => sp.remove(), 500);
  }, 1600);
})();

// ---- bottom banner: USD/JPY, NKY, TOPIX and Japanese headlines, scrolling ----
// The feeds have no CORS headers, so server.js relays them at /api/ticker.
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escHtml(s){ return esc(s); }
function fmtQ(v){
  if (v == null) return '';
  const d = Math.abs(v) >= 1000 ? 0 : Math.abs(v) >= 10 ? 2 : 3;
  return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
async function loadTicker(){
  const box = $('tick'), track = $('tickTrack');
  if (!box || !track) return;
  let d;
  try {
    const r = await fetch('/api/ticker', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch (e) { box.classList.add('off'); return; }
  const bits = [];
  (d.quotes || []).forEach(q => {
    let s = '<span class="q"><b>' + esc(q.sym) + '</b> ' + fmtQ(q.last);
    if (q.pct != null) {
      const cls = q.pct >= 0 ? 'up' : 'dn';
      s += ' <span class="' + cls + '">' + (q.chg >= 0 ? '+' : '') + fmtQ(q.chg) +
           ' (' + (q.pct >= 0 ? '+' : '') + q.pct.toFixed(2) + '%)</span>';
    }
    bits.push(s + '</span>');
  });
  (d.news || []).forEach(n => {
    const label = '<span class="src">' + esc(n.src) + '</span>' + esc(n.t);
    bits.push(n.u ? '<a href="' + esc(n.u) + '" target="_blank" rel="noopener">' + label + '</a>'
                  : '<span>' + label + '</span>');
  });
  if (!bits.length) { box.classList.add('off'); return; }
  const strip = bits.join('<span class="sep">◆</span>') + '<span class="sep">◆</span>';
  track.innerHTML = '<span class="run">' + strip + '</span><span class="run">' + strip + '</span>';
  box.classList.remove('off');
  // hold a steady ~55 px/sec however long the strip turns out to be
  requestAnimationFrame(() => {
    const w = track.scrollWidth / 2;
    track.style.animationDuration = Math.max(40, Math.round(w / 55)) + 's';
  });
}

// ---- header clock: 02:34 (JST) 12:34 (CDT) ----
function hhmm(tz){
  try {
    return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit',
      minute: '2-digit', hour12: false }).format(new Date());
  } catch (e) { return '--:--'; }
}
// Chicago is CST in winter and CDT in summer — ask the browser which it is today
function tzAbbr(tz, fallback){
  try {
    const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' })
      .formatToParts(new Date()).find(x => x.type === 'timeZoneName');
    return (p && /^[A-Z]{2,5}$/.test(p.value)) ? p.value : fallback;
  } catch (e) { return fallback; }
}
(function(){
  const el = $('clock');
  if (!el) return;
  const tick = () => {
    el.textContent = hhmm('Asia/Tokyo') + ' (JST)　' +
                     hhmm('America/Chicago') + ' (' + tzAbbr('America/Chicago', 'CST') + ')';
  };
  tick();
  setInterval(tick, 15000);          // minute resolution; no need to run every second
})();

(function(){

// ---- screen colour: pick the LCD background, the rest of the palette follows it ----
const LCD0 = '#a9b09b';
function rgb(hex){ const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function hex6(a){ return '#' + ((1 << 24) + (a[0] << 16) + (a[1] << 8) + a[2]).toString(16).slice(1); }
function dark(hex, k){ return hex6(rgb(hex).map(v => Math.round(v * k))); }          // toward black
function light(hex, k){ return hex6(rgb(hex).map(v => Math.round(v + (255 - v) * k))); } // toward white
function lum(hex){ const c = rgb(hex); return (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255; }

function applyBg(hex, push){
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) hex = LCD0;
  const s = document.documentElement.style;
  s.setProperty('--lcd', hex);
  setTimeout(drawLogo, 0);                // keep the splash in the same palette
  if (lum(hex) > 0.42) {                  // light screen, dark ink — the 200LX LCD
    s.setProperty('--lcd2', dark(hex, 0.90));
    s.setProperty('--ink',  dark(hex, 0.22));
    s.setProperty('--ink2', dark(hex, 0.52));
  } else {                                // dark screen, glowing ink — terminal style
    s.setProperty('--lcd2', light(hex, 0.12));
    s.setProperty('--ink',  light(hex, 0.86));
    s.setProperty('--ink2', light(hex, 0.52));
  }
  $('bgSel').value = hex;
  try { localStorage.setItem('nvsBg', hex); } catch (e) {}
  if (push !== false) pushUi();
}

function applyFont(){
  const f = FONTS[$('fontSel').value] || FONTS['mp12'];
  const size = parseInt($('sizeSel').value, 10) || 12;
  document.documentElement.style.setProperty('--sheet', f.stack);
  document.documentElement.style.setProperty('--fs', size + 'px');
  document.body.classList.toggle('smooth', !f.bitmap);
  document.body.style.fontWeight = $('boldChk').checked ? 'bold' : '';
  try {
    localStorage.setItem('nvsFont', $('fontSel').value);
    localStorage.setItem('nvsSize', String(size));
    localStorage.setItem('nvsBold', $('boldChk').checked ? '1' : '');
  } catch (e) {}
  pushUi();
}
(function(){
  let font = '', size = '', bold = '';
  try {
    font = localStorage.getItem('nvsFont') || '';
    size = localStorage.getItem('nvsSize') || '';
    bold = localStorage.getItem('nvsBold') || '';
    // migrate from the old single dot menu
    if (!font) {
      const old = localStorage.getItem('nvsDot');
      const mig = {'e8':['elisa','8'],'10':['mp10','10'],'12':['mp12','12'],'s12':['shino','12'],
                   '16':['dot16','16'],'e16':['elisa','16'],'20':['mp10','20'],'24':['mp12','24'],
                   's24':['shino','24'],'32':['dot16','32']};
      if (old && mig[old]) { font = mig[old][0]; size = mig[old][1]; }
    }
  } catch (e) {}
  if (!FONTS[font]) font = 'mp12';
  // device default: dense 12 on phones, 24 (12dot x2, the 200LX bold look) on big screens
  if (!size) size = window.innerWidth >= 1100 ? '24' : '12';
  $('fontSel').value = font;
  $('sizeSel').value = size;
  $('boldChk').checked = bold === '1';
  $('fontSel').onchange = applyFont;
  $('sizeSel').onchange = applyFont;
  $('boldChk').onchange = applyFont;
  applyFont();
  let bg = LCD0;
  try { bg = localStorage.getItem('nvsBg') || LCD0; } catch (e) {}
  applyBg(bg, false);
  $('bgSel').oninput  = () => applyBg($('bgSel').value, false);   // live while dragging
  $('bgSel').onchange = () => applyBg($('bgSel').value, true);    // save when committed
  $('bgRst').onclick  = () => applyBg(LCD0, true);
  $('colRst').onclick = () => { colW = []; saveColW(); render(); };
})();

// ---- keyboard ----------------------------------------------------------
// Nothing here fires while a text field (or the memo) has focus — the IME must
// own every keystroke there, so all shortcuts are for the main screen only.
//   ←/→         walk the calendar
//   alt+←/→     scroll the sheet sideways
//   ↑/↓ PgUp/PgDn Home/End   scroll the sheet
//   j / k       move the task highlight,  x  toggles it done
//   d / #       delete the highlighted task (undo chip appears for 15s), u undoes
//   t           jump to today,  [ / ]  switch companies
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.isComposing || e.keyCode === 229) return;      // mid-IME conversion
  if (e.ctrlKey || e.metaKey) return;
  const card = $('card');
  if (!card) return;
  const codes = sortedCodes();
  const step = 48, page = Math.max(80, card.clientHeight - 40);
  switch (e.key) {
    case 'ArrowUp':    card.scrollBy(0, -step); e.preventDefault(); break;
    case 'ArrowDown':  card.scrollBy(0,  step); e.preventDefault(); break;
    case 'ArrowLeft':
      if (e.altKey) card.scrollBy(-140, 0);
      else if (window.nvsMemo) window.nvsMemo.go(-1);
      e.preventDefault(); break;
    case 'ArrowRight':
      if (e.altKey) card.scrollBy(140, 0);
      else if (window.nvsMemo) window.nvsMemo.go(1);
      e.preventDefault(); break;
    case 'PageUp':     card.scrollBy(0, -page); e.preventDefault(); break;
    case 'PageDown':   card.scrollBy(0,  page); e.preventDefault(); break;
    case 'Home':       card.scrollTo({top:0, left:0}); e.preventDefault(); break;
    case 'End':        card.scrollTo({top:card.scrollHeight, left:0}); e.preventDefault(); break;
    case '[': if (codes.length > 1 && active) { const i = codes.indexOf(active); active = codes[(i - 1 + codes.length) % codes.length]; render(); pushUi(); } break;
    case ']': if (codes.length > 1 && active) { const i = codes.indexOf(active); active = codes[(i + 1) % codes.length]; render(); pushUi(); } break;
  }
  if (e.altKey) return;
  switch (e.key.toLowerCase()) {
    case 't': if (window.nvsMemo) { window.nvsMemo.today(); e.preventDefault(); } break;
    case 'j': if (window.nvsMemo) { window.nvsMemo.move(1);  e.preventDefault(); } break;
    case 'k': if (window.nvsMemo) { window.nvsMemo.move(-1); e.preventDefault(); } break;
    case 'x': if (window.nvsMemo) { window.nvsMemo.toggle(); e.preventDefault(); } break;
    case 'd':
    case '#': if (window.nvsMemo) { window.nvsMemo.remove(); e.preventDefault(); } break;
    case 'u': if (window.nvsMemo) { window.nvsMemo.undelete(); e.preventDefault(); } break;
  }
});

// ---- split divider: drag to resize the memo pane (width synced via nvs/ui) ----
(function(){
  const sp = $('split');
  if (!sp) return;
  try { const w0 = localStorage.getItem('nvsMemoW'); if (w0) document.documentElement.style.setProperty('--memow', w0 + 'px'); } catch (e) {}
  let drag = false;
  function move(x){
    const m = document.querySelector('main');
    const r = m.getBoundingClientRect();
    let w = Math.round(r.right - x - 14);
    w = Math.max(140, Math.min(r.width - 220, w));
    document.documentElement.style.setProperty('--memow', w + 'px');
  }
  sp.addEventListener('mousedown', e => {
    drag = true; sp.classList.add('on'); document.body.classList.add('dragging'); e.preventDefault();
  });
  window.addEventListener('mousemove', e => { if (drag) { move(e.clientX); e.preventDefault(); } });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = false; sp.classList.remove('on'); document.body.classList.remove('dragging');
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--memow')) || 300;
    try { localStorage.setItem('nvsMemoW', String(w)); } catch (e) {}
    pushUi();
  });
  sp.addEventListener('touchstart', e => { drag = true; sp.classList.add('on'); e.preventDefault(); }, {passive:false});
  window.addEventListener('touchmove', e => { if (drag && e.touches[0]) { move(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});
  window.addEventListener('touchend', () => {
    if (!drag) return;
    drag = false; sp.classList.remove('on');
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--memow')) || 300;
    try { localStorage.setItem('nvsMemoW', String(w)); } catch (e) {}
    pushUi();
  });
})();

// ---- UI state synced via Firebase (nvs/ui): font, size, bold, closed tabs, active tab ----
// every device loads the same screen; changes mirror live between open dashboards.
function pushUi(){
  if (uiApplying || !wired) return;
  try { pushUiNow(); } catch (e) { console.warn('ui push:', e && e.message); }
}
function pushUiNow(){
  const st = { font: $('fontSel').value, size: $('sizeSel').value,
               bold: $('boldChk').checked ? 1 : 0,
               hidden: [...hidden], active: active || null,
               memow: parseInt(getComputedStyle(document.documentElement).getPropertyValue('--memow')) || 300,
               bg: $('bgSel').value,
               colw: colW.map(w => w || 0),
               at: firebase.database.ServerValue.TIMESTAMP };
  db.ref('nvs/ui').set(st).catch(e => console.warn('ui save:', e && e.message));
}
function initUiSync(){
  db.ref('nvs/ui').on('value', snap => {
    const st = snap.val();
    if (!st) return;
    uiApplying = true;
    try {
      if (st.font && FONTS[st.font]) $('fontSel').value = st.font;
      if (st.size) $('sizeSel').value = String(st.size);
      $('boldChk').checked = !!st.bold;
      if (st.memow) {
        document.documentElement.style.setProperty('--memow', st.memow + 'px');
        try { localStorage.setItem('nvsMemoW', String(st.memow)); } catch (e) {}
      }
      applyFont();
      if (st.bg) applyBg(st.bg, false);
      if (Array.isArray(st.colw)) {
        colW = st.colw.map(w => w || 0);
        try { localStorage.setItem('nvsColW', JSON.stringify(colW)); } catch (e) {}
      }
      hidden = new Set(st.hidden || []);
      saveHidden();
      if ('active' in st && st.active !== active) { active = st.active || null; }
      render();
    } finally { uiApplying = false; }
  });
}

// ---- MEMO: the daily checklist + notes pane lives in memo.js ----
function fmt(v){
  if (typeof v === 'number') {
    return v.toLocaleString('ja-JP', { maximumFractionDigits: 3 });
  }
  return v == null ? '' : String(v);
}

function render(){
  // tabs
  const codes = sortedCodes();
  $('tabs').innerHTML = '';
  codes.forEach(c => {
    const t = document.createElement('div');
    t.className = 'tab' + (c === active ? ' active' : '');
    t.innerHTML = '<b>' + c + '</b><small>' + (data[c].company || '') + '</small>';
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '×'; x.title = 'close tab';
    x.onclick = ev => { ev.stopPropagation(); closeTab(c); };
    t.appendChild(x);
    t.onclick = () => { active = c; render(); pushUi(); };
    $('tabs').appendChild(t);
  });
  // hidden tabs are never lost — one click restores them all
  const nHidden = [...hidden].filter(c => data[c]).length;
  if (nHidden > 0) {
    const r = document.createElement('div');
    r.className = 'restore';
    r.textContent = '+ ' + nHidden + ' closed — restore';
    r.title = 'show closed tabs again';
    r.onclick = () => { hidden.clear(); if (!active) { const cs = sortedCodes(); active = cs[0] || null; } render(); saveHidden(); };
    $('tabs').appendChild(r);
  }

  // table
  const card = $('card');
  if (!active || !data[active]) {
    card.innerHTML = '<div id="empty">Type a ticker above — data appears here the moment Excel answers.</div>';
    return;
  }
  const d = data[active];
  const when = d.updatedAt ? new Date(d.updatedAt).toLocaleString('ja-JP') : '';
  let h = '<div class="meta"><b>' + (d.company||'') + '</b><span>' + d.code + '</span>' +
          '<span>更新 ' + when + '</span>' +
          '<button class="reload" onclick="request(\'' + d.code + '\')">↻ reload</button></div>';
  // A generic table: whatever heads/rows arrive get rendered. Nothing is assumed
  // about what any column means — numbers right-align, text left-aligns.
  const heads = d.heads || [];
  h += '<table id="grid">' + colGroup(heads.length) + '<thead><tr>';
  heads.forEach((x, i) => {
    const fc = /予/.test(String(x)) ? ' fc' : '';
    h += '<th class="c' + i + fc + '">' + escHtml(x) +
         '<span class="rz" data-col="' + i + '" title="drag to resize"></span></th>';
  });
  h += '</tr></thead><tbody>';
  (d.rows || []).forEach(r => {
    h += '<tr>';
    (r || []).forEach((v, i) => {
      const cls = 'c' + i + (typeof v === 'number' ? ' num' : ' txt');
      h += '<td class="' + cls + '">' + escHtml(fmt(v)) + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  card.innerHTML = h;
  wireResize();
}

// ---- column widths: drag a header edge, and the size is remembered ----
let colW = [];
try { colW = JSON.parse(localStorage.getItem('nvsColW') || '[]') || []; } catch (e) {}
function saveColW(){
  try { localStorage.setItem('nvsColW', JSON.stringify(colW)); } catch (e) {}
  pushUi();
}
function colGroup(n){
  let g = '<colgroup>';
  for (let i = 0; i < n; i++) g += colW[i] ? '<col style="width:' + colW[i] + 'px">' : '<col>';
  return g + '</colgroup>';
}
function wireResize(){
  const table = $('grid');
  if (!table) return;
  if (colW.some(w => w)) table.classList.add('fixed');
  table.querySelectorAll('.rz').forEach(handle => {
    handle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const idx = +handle.dataset.col;
      const th = handle.parentNode;
      const startX = e.clientX, startW = th.getBoundingClientRect().width;
      table.classList.add('fixed');
      document.body.classList.add('dragging');
      const move = ev => {
        const w = Math.max(40, Math.round(startW + ev.clientX - startX));
        colW[idx] = w;
        const col = table.querySelectorAll('col')[idx];
        if (col) col.style.width = w + 'px';
      };
      const up = () => {
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', up);
        document.body.classList.remove('dragging');
        saveColW();
      };
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
    });
  });
}
</script>
