<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NVS Dashboard</title>
<!-- build-20260813-200lx -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
  /* ---- HP 200LX / Lotus 1-2-3 ---- one font, one ink, one LCD ---- */
  :root{
    --lcd:#a9b09b;   /* LCD screen      */
    --lcd2:#99a18b;  /* LCD shadow      */
    --ink:#26291f;   /* pixel ink       */
    --ink2:#555e49;  /* dim ink         */
  }
  *{box-sizing:border-box}
  ::selection{background:var(--ink);color:var(--lcd)}
  html,body{height:100%}
  body{margin:0;background:var(--lcd);color:var(--ink);
       font:16px/1.4 'DotGothic16',monospace}
  /* top bar = Lotus inverse status line */
  header{display:flex;align-items:center;gap:14px;padding:6px 14px;
         padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));
         background:var(--ink);color:var(--lcd);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:400}
  #tickerBox{display:flex;gap:8px;align-items:center}
  #ticker{width:110px;padding:2px 8px;border:0;border-radius:0;
          background:var(--lcd);color:var(--ink);font:inherit;outline:none;text-transform:uppercase}
  #ticker::placeholder{color:var(--ink2)}
  button{padding:2px 10px;border:0;border-radius:0;background:var(--lcd);color:var(--ink);
         font:inherit;cursor:pointer}
  button:hover{background:var(--lcd2)}
  button:disabled{background:var(--ink2);color:var(--lcd);cursor:default}
  #status{font-size:16px;color:var(--lcd);display:flex;align-items:center;gap:8px;font:inherit}
  .dot{width:8px;height:8px;border-radius:0;background:var(--lcd2);flex:none}
  .dot.loading{background:var(--lcd);animation:pulse .8s steps(2,end) infinite}
  .dot.done{background:var(--lcd)} .dot.error{background:var(--lcd);animation:pulse .4s steps(2,end) infinite} .dot.notfound{background:var(--lcd2)}
  @keyframes pulse{50%{opacity:.15}}
  #userbox{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--lcd2)}
  /* tabs = plain text, active is inverse video */
  nav{display:flex;gap:2px;padding:4px 14px 0;flex-wrap:wrap}
  nav .tab{padding:1px 8px;border:0;border-radius:0;background:transparent;
           color:var(--ink2);cursor:pointer;font-size:14px;user-select:none}
  nav .tab.active{background:var(--ink);color:var(--lcd);font-weight:400}
  nav .tab small{color:inherit;opacity:.75;font-weight:400;margin-left:6px}
  nav .tab .x{margin-left:7px;padding:0 3px;color:inherit;opacity:.6;font-weight:400}
  nav .tab .x:hover{opacity:1;background:var(--ink);color:var(--lcd)}
  nav .restore{padding:1px 8px;border:0;color:var(--ink2);cursor:pointer;font-size:14px;
               user-select:none;background:transparent;text-decoration:underline dotted}
  nav .restore:hover{color:var(--ink)}
  main{padding:2px 14px 14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .card{background:var(--lcd);border:1px solid var(--ink);border-radius:0;
        overflow:auto;-webkit-overflow-scrolling:touch;outline:none;
        max-height:calc(100vh - 128px);max-height:calc(100dvh - 128px)}
  .card::-webkit-scrollbar{width:12px;height:12px}
  .card::-webkit-scrollbar-track{background:var(--lcd2)}
  .card::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--lcd2)}
  .meta{display:flex;gap:16px;align-items:baseline;padding:6px 12px 2px;color:var(--ink2);font-size:14px}
  .meta b{color:var(--ink);font-size:16px;font-weight:400}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-family:inherit}
  th,td{padding:2px 12px;border:0;white-space:nowrap;font-size:16px;line-height:1.5}
  /* column header row = inverse video like Lotus */
  th{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--lcd);
     text-align:right;font-weight:400}
  td:first-child,th:first-child{position:sticky;left:0}
  th:first-child{text-align:left;z-index:3}
  td{text-align:right}
  td:first-child{text-align:left;color:var(--ink);z-index:1;background:var(--lcd)}
  td.field{color:var(--ink2);font-size:13px;text-align:left}
  th.fc{background:var(--ink2);color:var(--lcd)}
  td.num{color:var(--ink)}
  tr:hover td{background:var(--lcd2)}
  #empty{padding:60px;text-align:center;color:var(--ink2)}
  .reload{margin-left:8px;background:transparent;border:1px solid var(--ink2);color:var(--ink2);
          padding:0 8px;font-size:13px}
  .reload:hover{color:var(--lcd);background:var(--ink);border-color:var(--ink)}
  #gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .gatebox{background:var(--lcd);border:1px solid var(--ink);border-radius:0;
           padding:36px 40px;max-width:420px;text-align:center}
  .gatebox h1{font-size:20px;margin:0 0 8px;font-weight:400}
  .gatebox p{color:var(--ink2);margin:0 0 20px}
  #signin{background:var(--ink);color:var(--lcd);border-radius:0;padding:8px 18px;font-size:16px}
  #signin:hover{background:var(--ink2)}
  #gateMsg{margin-top:14px;font-size:14px;color:var(--ink2);min-height:20px}
  /* ---- phones ---- */
  @media (max-width:640px){
    header{padding:6px 10px;gap:8px 10px}
    header h1{order:1}
    #userbox{order:2;font-size:12px;gap:8px}
    #tickerBox{order:3;flex:1 1 100%}
    #ticker{flex:1 1 auto;width:auto;padding:6px 8px}
    #status{order:4;flex:1 1 100%;font-size:14px}
    nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 10px 0}
    nav .tab{flex:0 0 auto;padding:4px 8px}
    main{padding:2px 8px 12px}
    .card{max-height:calc(100dvh - 165px)}
    th,td{padding:4px 10px}
    .meta{flex-wrap:wrap;gap:4px 12px;padding:6px 10px 2px}
    .gatebox{padding:28px 22px}
  }
</style>
</head>
<body>
<div id="gate">
  <div class="gatebox">
    <h1>NVS Dashboard</h1>
    <p>Sign in with your <b>@missionvalue.com</b> Google account.</p>
    <button id="signin">Sign in with Google</button>
    <div id="gateMsg"></div>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <h1>NVS Dashboard</h1>
  <div id="tickerBox">
    <input id="ticker" placeholder="enter ticker" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="go">Load</button>
  </div>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
  <div id="userbox"><span id="who"></span><button id="signout" class="reload">Sign out</button></div>
</header>
<nav id="tabs"></nav>
<main>
  <div class="card" id="card"><div id="empty">Type a ticker above — data appears here the moment Excel answers.</div></div>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ==================== PASTE YOUR FIREBASE CONFIG ====================
// Firebase console > Project settings > General > Your apps > Web app
const firebaseConfig = {
  apiKey: "AIzaSyBqdB2Oqg37poRoo05QpDmUITguvFKkDAw",
  authDomain: "research-92f30.firebaseapp.com",
  databaseURL: "https://research-92f30-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "research-92f30",
  storageBucket: "research-92f30.appspot.com",
  messagingSenderId: "522522297422",
  appId: "1:522522297422:web:dbbffb4621d08e3de32f1f",
};
// ====================================================================

const ALLOWED_DOMAIN = 'missionvalue.com';

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
let data = {};        // code -> payload
let active = null;
// tabs the user has "closed" (hidden from the strip; data stays in Firebase)
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem('nvsHidden') || '[]')); } catch (e) {}
function saveHidden(){ try { localStorage.setItem('nvsHidden', JSON.stringify([...hidden])); } catch (e) {} }
function unhide(code){ if (code && hidden.has(code)) { hidden.delete(code); saveHidden(); } }
let pendingFocus = null;  // a code whose "done" arrived before its data
let wired = false;    // data listeners attached only once, after sign-in

const $ = id => document.getElementById(id);
function setStatus(cls, text){ $('dot').className = 'dot ' + cls; $('statusText').textContent = text; }

const provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({ hd: ALLOWED_DOMAIN });  // no forced re-auth: reuse the trusted browser session

function show(view){ // 'gate' or 'app'
  $('gate').style.display = view === 'gate' ? 'flex' : 'none';
  $('app').style.display  = view === 'app'  ? 'block' : 'none';
}

$('signin').onclick = () => {
  $('gateMsg').textContent = 'Opening Google sign-in…';
  auth.signInWithPopup(provider).catch(e => {
    $('gateMsg').innerHTML = '<span class="err">' + (e.message || e) + '</span>';
  });
};
$('signout') && ($('signout').onclick = () => auth.signOut());

auth.onAuthStateChanged(user => {
  if (!user) { show('gate'); $('gateMsg').textContent = ''; return; }
  var email = (user.email || '').toLowerCase();
  var domainOk = email.endsWith('@' + ALLOWED_DOMAIN) && user.emailVerified;
  if (!domainOk) {
    show('gate');
    $('gateMsg').innerHTML = '<span class="err">' + email +
      ' is not a @' + ALLOWED_DOMAIN + ' account. Access denied.</span>';
    auth.signOut();
    return;
  }
  // authorised
  show('app');
  $('who').textContent = email;
  setStatus('', 'connected');
  if (wired) return;
  wired = true;

  db.ref('nvs/data').on('value', snap => {
    data = snap.val() || {};
    if (pendingFocus && data[pendingFocus]) {   // the just-loaded ticker finally has data
      active = pendingFocus;
      pendingFocus = null;
    } else if (active === null || !data[active]) {
      const codes = sortedCodes();
      active = codes.length ? codes[0] : null;
    }
    render();
  });

  db.ref('nvs/status').on('value', snap => {
    const s = snap.val();
    if (!s) return;
    if (s.state === 'loading') setStatus('loading', '⏳ ' + s.code + ' — Excel is loading…');
    else if (s.state === 'done') {
      // jump the view to the ticker that just finished loading
      unhide(s.code);                       // fresh data re-opens a closed tab
      if (s.code && data[s.code]) { active = s.code; render(); }
      else pendingFocus = s.code;   // data may arrive a beat later
      const when = new Date(s.at || Date.now()).toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
      setStatus('done', '✅ ' + (s.msg || s.code) + ' — updated ' + when);
    }
    else if (s.state === 'notfound') setStatus('notfound', '❓ ' + s.code + ' — not a valid company code (unknown, delisted, or not a company)');
    else if (s.state === 'timeout') setStatus('error', '⌛ ' + s.code + ' — 接続がタイムアウトされました (connection timed out) — try reloading');
    else if (s.state === 'error') setStatus('error', '✖ ' + s.code + ': ' + (s.msg || 'failed'));
  });
});

function sortedCodes(){
  return Object.keys(data)
    .filter(c => !hidden.has(c))
    .sort((a,b) => (data[b].updatedAt||0) - (data[a].updatedAt||0));
}

function closeTab(code){
  hidden.add(code); saveHidden();
  if (active === code) {
    const codes = sortedCodes();
    active = codes.length ? codes[0] : null;
  }
  render();
}

function request(code){
  code = String(code||'').trim().toUpperCase();   // 429a -> 429A so lookups don't fail
  if (!code) return;
  unhide(code);                                   // re-requesting a closed tab brings it back
  db.ref('nvs/request').set({ code: code, id: Date.now() });
  setStatus('loading', '⏳ ' + code + ' — sent to the PC…');
}

// force uppercase live as the user types (keeps the caret in place)
$('ticker').addEventListener('input', e => {
  const up = e.target.value.toUpperCase();
  if (up !== e.target.value) {
    const p = e.target.selectionStart;
    e.target.value = up;
    e.target.setSelectionRange(p, p);
  }
});
$('go').onclick = () => request($('ticker').value);
$('ticker').addEventListener('keydown', e => { if (e.key === 'Enter') request($('ticker').value); });


// ---- keyboard: scroll the sheet like a 1-2-3 grid; [ and ] switch companies ----
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const card = $('card');
  if (!card) return;
  const codes = sortedCodes();
  const step = 48, page = Math.max(80, card.clientHeight - 40);
  switch (e.key) {
    case 'ArrowUp':    card.scrollBy(0, -step); e.preventDefault(); break;
    case 'ArrowDown':  card.scrollBy(0,  step); e.preventDefault(); break;
    case 'ArrowLeft':  card.scrollBy(-140, 0);  e.preventDefault(); break;
    case 'ArrowRight': card.scrollBy( 140, 0);  e.preventDefault(); break;
    case 'PageUp':     card.scrollBy(0, -page); e.preventDefault(); break;
    case 'PageDown':   card.scrollBy(0,  page); e.preventDefault(); break;
    case 'Home':       card.scrollTo({top:0, left:0}); e.preventDefault(); break;
    case 'End':        card.scrollTo({top:card.scrollHeight, left:0}); e.preventDefault(); break;
    case '[': if (codes.length > 1 && active) { const i = codes.indexOf(active); active = codes[(i - 1 + codes.length) % codes.length]; render(); } break;
    case ']': if (codes.length > 1 && active) { const i = codes.indexOf(active); active = codes[(i + 1) % codes.length]; render(); } break;
  }
});

function fmt(v){
  if (typeof v === 'number') {
    return v.toLocaleString('ja-JP', { maximumFractionDigits: 3 });
  }
  return v == null ? '' : String(v);
}

function render(){
  // tabs
  const codes = sortedCodes();
  $('tabs').innerHTML = '';
  codes.forEach(c => {
    const t = document.createElement('div');
    t.className = 'tab' + (c === active ? ' active' : '');
    t.innerHTML = '<b>' + c + '</b><small>' + (data[c].company || '') + '</small>';
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '×'; x.title = 'close tab';
    x.onclick = ev => { ev.stopPropagation(); closeTab(c); };
    t.appendChild(x);
    t.onclick = () => { active = c; render(); };
    $('tabs').appendChild(t);
  });
  // hidden tabs are never lost — one click restores them all
  const nHidden = [...hidden].filter(c => data[c]).length;
  if (nHidden > 0) {
    const r = document.createElement('div');
    r.className = 'restore';
    r.textContent = '+ ' + nHidden + ' closed — restore';
    r.title = 'show closed tabs again';
    r.onclick = () => { hidden.clear(); saveHidden(); if (!active) { const cs = sortedCodes(); active = cs[0] || null; } render(); };
    $('tabs').appendChild(r);
  }

  // table
  const card = $('card');
  if (!active || !data[active]) {
    card.innerHTML = '<div id="empty">Type a ticker above — data appears here the moment Excel answers.</div>';
    return;
  }
  const d = data[active];
  const when = d.updatedAt ? new Date(d.updatedAt).toLocaleString('ja-JP') : '';
  let h = '<div class="meta"><b>' + (d.company||'') + '</b><span>' + d.code + '</span>' +
          '<span>更新 ' + when + '</span>' +
          '<button class="reload" onclick="request(\'' + d.code + '\')">↻ reload</button></div>';
  h += '<table><thead><tr>';
  (d.heads||[]).forEach(x => {
    const fc = /予/.test(String(x)) ? ' class="fc"' : '';
    h += '<th' + fc + '>' + x + '</th>';
  });
  h += '</tr></thead><tbody>';
  (d.rows||[]).forEach(r => {
    h += '<tr>';
    (r||[]).forEach((v,i) => {
      const cls = i === 1 ? 'field' : (typeof v === 'number' ? 'num' : '');
      h += '<td class="' + cls + '">' + fmt(v) + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  card.innerHTML = h;
}
</script>
</body>
</html>
