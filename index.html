<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NVS Dashboard</title>
<!-- build-20260813-closetabs -->
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3c;
    --text:#e8eaf0; --dim:#9aa3b2; --accent:#4f8ef7; --ok:#3fb96c; --err:#e5534b; --warn:#d9a239;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
         padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));
         background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
  #tickerBox{display:flex;gap:8px;align-items:center}
  #ticker{width:130px;padding:9px 11px;border-radius:6px;border:1px solid var(--line);
          background:var(--panel2);color:var(--text);font-size:16px;outline:none}
  #ticker:focus{border-color:var(--accent)}
  button{padding:9px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;
         font-size:14px;cursor:pointer}
  button:disabled{background:#3a3f4d;cursor:default}
  #status{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
  .dot.loading{background:var(--warn);animation:pulse 1s infinite}
  .dot.done{background:var(--ok)} .dot.error{background:var(--err)} .dot.notfound{background:var(--warn)}
  @keyframes pulse{50%{opacity:.35}}
  nav{display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap}
  nav .tab{padding:7px 14px;border-radius:8px 8px 0 0;background:var(--panel);
           border:1px solid var(--line);border-bottom:none;color:var(--dim);cursor:pointer;
           font-size:13px;user-select:none}
  nav .tab.active{background:var(--panel2);color:var(--text);font-weight:600}
  nav .tab small{color:var(--dim);font-weight:400;margin-left:6px}
  nav .tab .x{margin-left:8px;padding:0 5px;border-radius:4px;color:var(--dim);font-weight:400}
  nav .tab .x:hover{color:#fff;background:var(--err)}
  nav .restore{padding:7px 12px;border-radius:8px 8px 0 0;border:1px dashed var(--line);
               color:var(--dim);cursor:pointer;font-size:12px;user-select:none;background:transparent}
  nav .restore:hover{color:var(--text);border-color:var(--accent)}
  main{padding:0 20px 30px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:0 8px 8px 8px;
        overflow:auto;-webkit-overflow-scrolling:touch;
        max-height:calc(100vh - 170px);max-height:calc(100dvh - 170px)}
  .meta{display:flex;gap:18px;align-items:baseline;padding:12px 16px 4px;color:var(--dim);font-size:12px}
  .meta b{color:var(--text);font-size:16px}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:6px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:right;font-weight:600;font-size:12.5px}
  /* keep the row-label column pinned while wide tables scroll sideways (esp. on phones) */
  td:first-child,th:first-child{position:sticky;left:0}
  th:first-child{text-align:left;z-index:3}
  td{text-align:right}
  td:first-child{text-align:left;color:var(--text);z-index:1;background:var(--panel2)}
  td.field{color:#5b6474;font-size:11px;text-align:left}
  th.fc{color:var(--warn)}
  td.num{color:#cfe0ff}
  tr:hover td{background:rgba(79,142,247,.06)}
  #empty{padding:60px;text-align:center;color:var(--dim)}
  .reload{margin-left:8px;background:transparent;border:1px solid var(--line);color:var(--dim);
          padding:4px 10px;font-size:12px}
  .reload:hover{color:var(--text);border-color:var(--accent)}
  #gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .gatebox{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
           padding:40px 44px;max-width:420px;text-align:center}
  .gatebox h1{font-size:20px;margin:0 0 8px}
  .gatebox p{color:var(--dim);margin:0 0 22px}
  #signin{background:#fff;color:#202124;font-weight:600;border-radius:8px;padding:11px 20px;font-size:14px}
  #signin:hover{background:#f1f3f4}
  #gateMsg{margin-top:16px;font-size:13px;color:var(--dim);min-height:20px}
  #userbox{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
  header{gap:14px}
  /* ---- phones: stack the header, scroll the tab strip, thumb-size the input ---- */
  @media (max-width:640px){
    header{padding:10px 12px;gap:8px 10px}
    header h1{order:1;font-size:14px}
    #userbox{order:2;font-size:11px;gap:8px}
    #tickerBox{order:3;flex:1 1 100%}
    #ticker{flex:1 1 auto;width:auto}
    #status{order:4;flex:1 1 100%;font-size:12px}
    nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 0}
    nav .tab{flex:0 0 auto}
    main{padding:0 10px 24px}
    .card{max-height:calc(100dvh - 200px)}
    th,td{padding:8px 11px}
    .meta{flex-wrap:wrap;gap:6px 14px;padding:10px 12px 4px}
    .gatebox{padding:32px 24px}
  }
</style>
</head>
<body>
<div id="gate">
  <div class="gatebox">
    <h1>NVS Dashboard</h1>
    <p>Sign in with your <b>@missionvalue.com</b> Google account.</p>
    <button id="signin">Sign in with Google</button>
    <div id="gateMsg"></div>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <h1>NVS Dashboard</h1>
  <div id="tickerBox">
    <input id="ticker" placeholder="enter ticker" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="go">Load</button>
  </div>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
  <div id="userbox"><span id="who"></span><button id="signout" class="reload">Sign out</button></div>
</header>
<nav id="tabs"></nav>
<main>
  <div class="card" id="card"><div id="empty">Type a ticker above — data appears here the moment Excel answers.</div></div>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ==================== PASTE YOUR FIREBASE CONFIG ====================
// Firebase console > Project settings > General > Your apps > Web app
const firebaseConfig = {
  apiKey: "AIzaSyBqdB2Oqg37poRoo05QpDmUITguvFKkDAw",
  authDomain: "research-92f30.firebaseapp.com",
  databaseURL: "https://research-92f30-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "research-92f30",
  storageBucket: "research-92f30.appspot.com",
  messagingSenderId: "522522297422",
  appId: "1:522522297422:web:dbbffb4621d08e3de32f1f",
};
// ====================================================================

const ALLOWED_DOMAIN = 'missionvalue.com';

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
let data = {};        // code -> payload
let active = null;
// tabs the user has "closed" (hidden from the strip; data stays in Firebase)
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem('nvsHidden') || '[]')); } catch (e) {}
function saveHidden(){ try { localStorage.setItem('nvsHidden', JSON.stringify([...hidden])); } catch (e) {} }
function unhide(code){ if (code && hidden.has(code)) { hidden.delete(code); saveHidden(); } }
let pendingFocus = null;  // a code whose "done" arrived before its data
let wired = false;    // data listeners attached only once, after sign-in

const $ = id => document.getElementById(id);
function setStatus(cls, text){ $('dot').className = 'dot ' + cls; $('statusText').textContent = text; }

const provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({ hd: ALLOWED_DOMAIN });  // no forced re-auth: reuse the trusted browser session

function show(view){ // 'gate' or 'app'
  $('gate').style.display = view === 'gate' ? 'flex' : 'none';
  $('app').style.display  = view === 'app'  ? 'block' : 'none';
}

$('signin').onclick = () => {
  $('gateMsg').textContent = 'Opening Google sign-in…';
  auth.signInWithPopup(provider).catch(e => {
    $('gateMsg').innerHTML = '<span class="err">' + (e.message || e) + '</span>';
  });
};
$('signout') && ($('signout').onclick = () => auth.signOut());

auth.onAuthStateChanged(user => {
  if (!user) { show('gate'); $('gateMsg').textContent = ''; return; }
  var email = (user.email || '').toLowerCase();
  var domainOk = email.endsWith('@' + ALLOWED_DOMAIN) && user.emailVerified;
  if (!domainOk) {
    show('gate');
    $('gateMsg').innerHTML = '<span class="err">' + email +
      ' is not a @' + ALLOWED_DOMAIN + ' account. Access denied.</span>';
    auth.signOut();
    return;
  }
  // authorised
  show('app');
  $('who').textContent = email;
  setStatus('', 'connected');
  if (wired) return;
  wired = true;

  db.ref('nvs/data').on('value', snap => {
    data = snap.val() || {};
    if (pendingFocus && data[pendingFocus]) {   // the just-loaded ticker finally has data
      active = pendingFocus;
      pendingFocus = null;
    } else if (active === null || !data[active]) {
      const codes = sortedCodes();
      active = codes.length ? codes[0] : null;
    }
    render();
  });

  db.ref('nvs/status').on('value', snap => {
    const s = snap.val();
    if (!s) return;
    if (s.state === 'loading') setStatus('loading', '⏳ ' + s.code + ' — Excel is loading…');
    else if (s.state === 'done') {
      // jump the view to the ticker that just finished loading
      unhide(s.code);                       // fresh data re-opens a closed tab
      if (s.code && data[s.code]) { active = s.code; render(); }
      else pendingFocus = s.code;   // data may arrive a beat later
      const when = new Date(s.at || Date.now()).toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
      setStatus('done', '✅ ' + (s.msg || s.code) + ' — updated ' + when);
    }
    else if (s.state === 'notfound') setStatus('notfound', '❓ ' + s.code + ' — not a valid company code (unknown, delisted, or not a company)');
    else if (s.state === 'timeout') setStatus('error', '⌛ ' + s.code + ' — 接続がタイムアウトされました (connection timed out) — try reloading');
    else if (s.state === 'error') setStatus('error', '✖ ' + s.code + ': ' + (s.msg || 'failed'));
  });
});

function sortedCodes(){
  return Object.keys(data)
    .filter(c => !hidden.has(c))
    .sort((a,b) => (data[b].updatedAt||0) - (data[a].updatedAt||0));
}

function closeTab(code){
  hidden.add(code); saveHidden();
  if (active === code) {
    const codes = sortedCodes();
    active = codes.length ? codes[0] : null;
  }
  render();
}

function request(code){
  code = String(code||'').trim().toUpperCase();   // 429a -> 429A so lookups don't fail
  if (!code) return;
  unhide(code);                                   // re-requesting a closed tab brings it back
  db.ref('nvs/request').set({ code: code, id: Date.now() });
  setStatus('loading', '⏳ ' + code + ' — sent to the PC…');
}

// force uppercase live as the user types (keeps the caret in place)
$('ticker').addEventListener('input', e => {
  const up = e.target.value.toUpperCase();
  if (up !== e.target.value) {
    const p = e.target.selectionStart;
    e.target.value = up;
    e.target.setSelectionRange(p, p);
  }
});
$('go').onclick = () => request($('ticker').value);
$('ticker').addEventListener('keydown', e => { if (e.key === 'Enter') request($('ticker').value); });

function fmt(v){
  if (typeof v === 'number') {
    return v.toLocaleString('ja-JP', { maximumFractionDigits: 3 });
  }
  return v == null ? '' : String(v);
}

function render(){
  // tabs
  const codes = sortedCodes();
  $('tabs').innerHTML = '';
  codes.forEach(c => {
    const t = document.createElement('div');
    t.className = 'tab' + (c === active ? ' active' : '');
    t.innerHTML = '<b>' + c + '</b><small>' + (data[c].company || '') + '</small>';
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '×'; x.title = 'close tab';
    x.onclick = ev => { ev.stopPropagation(); closeTab(c); };
    t.appendChild(x);
    t.onclick = () => { active = c; render(); };
    $('tabs').appendChild(t);
  });
  // hidden tabs are never lost — one click restores them all
  const nHidden = [...hidden].filter(c => data[c]).length;
  if (nHidden > 0) {
    const r = document.createElement('div');
    r.className = 'restore';
    r.textContent = '+ ' + nHidden + ' closed — restore';
    r.title = 'show closed tabs again';
    r.onclick = () => { hidden.clear(); saveHidden(); if (!active) { const cs = sortedCodes(); active = cs[0] || null; } render(); };
    $('tabs').appendChild(r);
  }

  // table
  const card = $('card');
  if (!active || !data[active]) {
    card.innerHTML = '<div id="empty">Type a ticker above — data appears here the moment Excel answers.</div>';
    return;
  }
  const d = data[active];
  const when = d.updatedAt ? new Date(d.updatedAt).toLocaleString('ja-JP') : '';
  let h = '<div class="meta"><b>' + (d.company||'') + '</b><span>' + d.code + '</span>' +
          '<span>更新 ' + when + '</span>' +
          '<button class="reload" onclick="request(\'' + d.code + '\')">↻ reload</button></div>';
  h += '<table><thead><tr>';
  (d.heads||[]).forEach(x => {
    const fc = /予/.test(String(x)) ? ' class="fc"' : '';
    h += '<th' + fc + '>' + x + '</th>';
  });
  h += '</tr></thead><tbody>';
  (d.rows||[]).forEach(r => {
    h += '<tr>';
    (r||[]).forEach((v,i) => {
      const cls = i === 1 ? 'field' : (typeof v === 'number' ? 'num' : '');
      h += '<td class="' + cls + '">' + fmt(v) + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  card.innerHTML = h;
}
</script>
</body>
</html>
